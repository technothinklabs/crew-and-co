  <!-- Cup handle -->
  <path d="M23 15.5 Q29 15.5 29 18 Q29 20.5 23 20.5" stroke="#FAF4EC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold saucer -->
